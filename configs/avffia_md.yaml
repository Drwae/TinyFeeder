# TinyFeeder on the public AV-FFIA dataset (Cui et al., IEEE T-ASE 2024).
# Prepare the data first: scripts/prepare_avffia.py (see docs/REPRODUCE.md).
# Budgets below fit one 24 GB GPU in roughly 1-2 days; lower batch_size on smaller GPUs.
seed: 2026
out_dir: runs/avffia_md               # starts as a copy of runs/avffia (splits, teachers, baselines)

data:
  synthetic: false
  path: data/avffia/avffia_224.npz
  img_size: 224
  n_mels: 128
  split_fracs: [0.64, 0.16, 0.20]   # by recording session (group_id), never by clip

train:                               # protocol shared by every model (teachers, baselines, TinyFeeder stages)
  ema_decay: 0.995                     # evaluate and keep the exponential moving average of the weights
  select: last                         # the final (averaged) weights; the 6 validation sessions are only monitored,
                                       # never used to pick an epoch (a lucky epoch on 6 sessions does not hold on test)

teachers:                            # distillation teachers (ImageNet-pretrained, via timm)
  backbones: [resnest50d, swin_tiny_patch4_window7_224, convnext_base]
  use_timm: true
  pretrained: true
  epochs: 30
  lr: 1.0e-4
  batch_size: 32

baselines:                           # lightweight comparison models trained with the same protocol
  backbones: [mobilenet_v3_large, efficientnet_b0, shufflenet_v2_x1_0, resnet18]
  use_timm: false
  pretrained: true
  epochs: 30
  lr: 3.0e-4
  batch_size: 64

baselines_scratch:                   # the same backbones from random init, trained with TinyFeeder's protocol
  backbones: [mobilenet_v3_large, efficientnet_b0, shufflenet_v2_x1_0, resnet18]
  use_timm: false
  pretrained: false
  epochs: 40
  lr: 2.0e-3
  batch_size: 64
  weight_decay: 0.05

nas:
  latency_csv: data/jetson_latency.csv   # from deploy/profile_device.py run ON the Jetson
  profile_archs: 300                     # used only if latency_csv is missing (host CPU fallback)
  population: 16
  generations: 12
  proxy_epochs: 4                        # proxy task: short training of each candidate, no weight sharing
  proxy_train_units: null                # null = all training sessions
  proxy_batch_size: 128
  latency_budget_ms: 50.0
  params_budget: 500000
  patience: 10

student:                             # ImageNet-pretrained tiny visual backbone instead of the searched encoder
  visual_backbone: mobilenetv3_small_050   # timm; 0.27M params without its conv head (total student ~0.43M)

stage1:
  modality_dropout: 0.3                # a sample loses its video or its audio 30% of the time (15% + 15%)
  epochs: 30
  lr: 5.0e-4                           # fine-tuning a pretrained backbone (the pretrained baselines use 3e-4)
  batch_size: 128
  weight_decay: 0.01
  kd: true                             # multi-teacher KD from the first epoch (same loss as stage 3)
  warmup: 0
  ramp: 5
  beta_max: 0.7
  tau: 4.0
  lambdas: [1.0, 0.5, 0.3]

stage2:
  modality_dropout: 0.3                # a sample loses its video or its audio 30% of the time (15% + 15%)
  epochs: 30
  lr: 1.0e-4
  batch_size: 128
  fp16_fraction: 0.15
  sensitivity_val_units: null

stage3:
  modality_dropout: 0.3                # a sample loses its video or its audio 30% of the time (15% + 15%)
  epochs: 60
  warmup: 10
  lr: 1.0e-4
  batch_size: 64
  tau: 4.0
  beta_max: 0.7
  lambdas: [1.0, 0.5, 0.3]

export:
  onnx: true
